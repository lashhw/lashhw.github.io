- title: "Multimodal Perception and Comprehension of Corner Cases in Autonomous Driving"
  image: assets/img/project_img_placeholder.jpg
  description: "Led the team to 1st place (out of 12 teams) on multimodal understanding of autonomous driving corner cases. Enhanced LLaVA by combining LoRA fine-tuning with cross-attention layers that fuse segmentation, instance, depth, and ViT features, enabling the model to reason over complex driving scenarios. Also built a data augmentation pipeline over generated QA pairs to iteratively refine the training set."
  venue: "Course Team Project, Deep Learning for Computer Vision (Prof. Yu-Chiang Frank Wang), NTU"
  year: 2024
  selected: true
  links:
    Poster: https://github.com/DLCV-Fall-2024/DLCV-Fall-2024-Final-1-uber603/blob/main/poster.pdf
    Code: https://github.com/DLCV-Fall-2024/DLCV-Fall-2024-Final-1-uber603

- title: "Hardware Design & Verification Flow for AQB8 Ray Tracing Accelerator"
  image: assets/img/project_img_placeholder.jpg
  description: "Led the end-to-end development for the AQB8 accelerator behind our ISCA 2025 paper, from architectural exploration to implementation and final analysis. FPGA-based prototyping on Xilinx Zynq with Vitis HLS, Vivado, and PetaLinux; standard-cell ASIC flow on TSMC 40nm with Catapult HLS and Design Compiler; functional verification with QuestaSim and power analysis with PrimePower."
  venue: "Research Project, Computer Architecture System Laboratory (Prof. Tsung Tai Yeh), NYCU"
  year: 2024
  selected: true
  links:
    Paper: https://doi.org/10.1145/3695053.3731104
    Code: https://github.com/nycu-caslab/AQB8

- title: "Implementation of a Single-Core RISC CPU: From RTL to GDSII"
  image: assets/img/project_img_placeholder.jpg
  description: "Independently designed a 16-bit single-core CPU with a MIPS-like ISA and AXI4 interfaces for instruction and data memory, then carried it through the entire ASIC design flow from RTL to GDSII — logic synthesis, floorplanning, automatic place & route, and final layout generation. Verified with RTL, gate-level, and post-layout simulation, plus STA, LVS, and DRC using industry-standard CAD tools."
  venue: "Course Project, Integrated Circuit Design Laboratory (Prof. Chen-Yi Lee), NYCU"
  year: 2024
  selected: true
  note: "Source code is not publicly available due to course policy."

- title: "Circuit Routers based on Greedy, Heuristic, and SAT Algorithms"
  image: assets/img/project_img_placeholder.jpg
  description: "Implemented channel, global, and detailed circuit routers based on foundational research papers, applying optimization techniques to NP-hard routing problems. Targeted the ISPD 2008 contest benchmarks for the global router and used MaxSAT/ILP solvers for exact detailed routing; all routers were validated against the provided specifications, achieving leading results among peers in the course."
  venue: "Course Project, The Applications of Algorithms on Routing Problems (Prof. Yih-Lang Li), NYCU"
  year: 2023
  links:
    Code: https://github.com/lashhw/routing-lab

- title: Memory-Efficient MultiHeadAttention Operator for TensorFlow Lite Micro
  image: assets/img/project_img_placeholder.jpg
  description: "Investigated the challenges of deploying Transformer models on microcontrollers (TinyML) through TensorFlow Lite for Microcontrollers, and identified the MultiHeadAttention layer as the critical SRAM bottleneck during on-device inference. Developed and implemented a custom TFLM operator that reduces peak SRAM requirement by over 90% (from 17MB to ~1MB) for the MobileViT-XXS model."
  venue: Summer Internship, Embedded and Mobile Computing Lab (Prof. Pi-Cheng Hsiu), Academia Sinica
  year: 2023
  links:
    Code: https://github.com/lashhw/tflm-transformer

- title: Mixed-Precision Ray Tracing for Mobile Platforms
  image: assets/img/project_img_placeholder.jpg
  description: "Collaboration with MediaTek on reducing the memory bandwidth demand of ray tracing (RT) accelerators on mobile platforms. Built a functional CUDA path tracer supporting physically-based rendering and parallel traversal, then designed a novel mixed-precision RT algorithm validated via SystemC/TLM simulation, achieving 20% memory savings for key RT data structures."
  venue: Research Project, NYCU &times; MediaTek Advanced Research Center (MARC)
  year: 2023
  note: "Source code is not publicly available due to NDA restrictions."

- title: "Mini-Pascal Compiler: From Source Code to JVM Bytecode"
  image: assets/img/project_img_placeholder.jpg
  description: "Independently designed a compiler for Mini-Pascal, a Pascal subset, covering a flex-based scanner, a bison LALR parser that builds the AST, semantic analysis over a scoped symbol table with static type checking, and a code generator emitting Jasmin assembly, assembled into JVM bytecode. The resulting compiler correctly compiles and runs non-trivial programs such as quicksort and recursive Fibonacci."
  venue: Course Project, Introduction to Compiler Design (Prof. Wuu Yang), NYCU
  year: 2022
  links:
    Code: https://github.com/lashhw/mini-pascal-compiler

- title: "Real-time Parking Vacancy Forecasting System"
  image: assets/img/project_img_placeholder.jpg
  description: "Led the team project awarded Best Project (out of 249 students) for an end-to-end real-time parking vacancy forecasting system. Designed the full architecture covering automated data collection, time-series model training, and real-time deployment. The LSTM model achieved low prediction error with inference fast enough for live requests, and was deployed as a serverless API on Azure Functions."
  venue: "Course Team Project, Introduction to Artificial Intelligence (Prof. Wen-Chih Peng), NYCU"
  year: 2022
  links:
    Video: https://www.youtube.com/watch?v=wCParWOSb5I
    Code: https://github.com/lashhw/AI-Final-Project

- title: "Web-Based Search Tool for College Admission Requirements"
  image: assets/img/project_img_placeholder.jpg
  description: "Built a web tool that lets Taiwanese high school students look up which entrance-exam subjects and score thresholds each university department counts toward admission, consolidating information that is otherwise scattered across hundreds of pages on the official admission committees' sites. Since 2019, it has served 64,000 page views from 24,000 unique visitors."
  venue: "Side Project"
  year: 2019
  links:
    Website: https://applytool.netlify.app/
    Code: https://github.com/lashhw/applytool
