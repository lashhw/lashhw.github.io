- title: "WG-KV: Learned KV Admission for Efficient Long-Context LLM Inference"
  image: assets/img/project_img_placeholder.jpg
  description: "Built the training and serving stack behind our EMNLP 2026 paper, which introduces KV Admission alongside KV Selection and Eviction. Trained a lightweight per-head write gate by self-distillation from the frozen full-attention model, then built a dual-cache paged memory manager and sparse prefill/decode kernels that turn the resulting ragged per-head caches into 2.6–4.2x prefill and 1.6–2.6x decode speedups."
  venue: "Master's Thesis, NTU"
  year: 2026
  bibkey: "wgkv"

- title: "STM32 Deployment and Benchmarking Toolchain for Multi-Branch TinyML"
  image: assets/img/project_img_placeholder.jpg
  description: "Built the deployment and benchmarking toolchain for our TCAD 2026 paper on DupNAS, a framework that jointly optimizes neural architecture and multi-branch tensor splitting to fit vision models onto resource-constrained microcontrollers. It turns the searched networks into real STM32 measurements via tile-by-tile ONNX rewriting and deployment through TensorFlow Lite Micro and STM32Cube.AI."
  venue: "Research Project, Embedded and Mobile Computing Lab (Prof. Pi-Cheng Hsiu), Academia Sinica"
  year: 2026
  bibkey: "dupnas"

- title: "Linux Kernel Programming: Syscall Interception and Page-Table Manipulation"
  image: assets/img/project_img_placeholder.jpg
  description: "Built a loadable kernel module that hides itself from the module list, masquerades process names, and filters syscalls per-process by hooking the syscall table. Also added a custom ARM64 Linux syscall that exposes a process's page tables to user space, and built a <code>userfaultfd</code> handler that walks the page-table hierarchy to translate addresses and install page-table entries on demand."
  venue: "Course Team Project, Advanced Topics in Software Systems Design and Implementation (Prof. Shih-Wei Li), NTU"
  year: 2025
  links:
    Code: https://github.com/lashhw/ssdi-hw

- title: "Dataflow Graph Extraction in LLVM for High-Level Synthesis"
  image: assets/img/project_img_placeholder.jpg
  description: "Built a custom LLVM compiler pass that turns C++ functions into dataflow graphs, making explicit the computational dependencies that hardware designers rely on to pipeline a design. Working on LLVM's intermediate representation rather than the syntax tree lets the pass compose with existing optimizations such as dead code elimination (DCE) and common subexpression elimination (CSE)."
  venue: "Course Project, Advanced Compiler Design (Prof. Shih-Wei Liao), NTU"
  year: 2024
  links:
    Report: https://github.com/lashhw/ntu-advanced-compiler-hw4/blob/main/report.pdf
    Code: https://github.com/lashhw/ntu-advanced-compiler-hw4

- title: "Design and Implementation of a Single-Core RISC CPU: From RTL to GDSII"
  image: assets/img/project_img_placeholder.jpg
  description: "Independently designed a 16-bit single-core CPU with a MIPS-like ISA and AXI4 interfaces for instruction and data memory, then carried it through the entire ASIC design flow from RTL to GDSII, covering logic synthesis, floorplanning, automatic place & route (APR), and final layout generation. Verified with RTL, gate-level, and post-layout simulation, plus STA, LVS, and DRC using industry-standard CAD tools."
  venue: "Course Project, Integrated Circuit Design Laboratory (Prof. Chen-Yi Lee), NYCU"
  year: 2024
  selected: true
  note: "Source code is not publicly available due to course policy."

- title: "AQB8 Ray Tracing Accelerator: From HLS to FPGA and ASIC"
  image: assets/img/project_img_placeholder.jpg
  description: "Led the hardware development behind our ISCA 2025 paper on AQB8, a ray tracing (RT) accelerator that replaces FP32 arithmetic with low-bit integer units during BVH traversal. Prototyped it on a Xilinx Zynq FPGA with Vitis HLS, Vivado, and PetaLinux, then took the same design through a TSMC 40nm standard-cell ASIC flow using Catapult HLS, Design Compiler, QuestaSim, and PrimePower for 27% less area and 49% lower energy than modern GPU RT accelerators."
  venue: "Research Project, Computer Architecture System Laboratory (Prof. Tsung Tai Yeh), NYCU"
  year: 2024
  selected: true
  bibkey: "aqb8"

- title: "Multimodal Perception and Comprehension of Corner Cases in Autonomous Driving"
  image: assets/img/project_img_placeholder.jpg
  description: "Led the team to 1st place (out of 12 teams) on multimodal understanding of autonomous driving corner cases. Enhanced LLaVA by combining LoRA fine-tuning with cross-attention layers that fuse segmentation, instance, depth, and ViT features, enabling the model to reason over complex driving scenarios. Also built a data augmentation pipeline over generated QA pairs to iteratively refine the training set."
  venue: "Course Team Project, Deep Learning for Computer Vision (Prof. Yu-Chiang Frank Wang), NTU"
  year: 2024
  selected: true
  links:
    Poster: https://github.com/lashhw/DLCV-Fall-2024-Final-1-uber603/blob/main/poster.pdf
    Code: https://github.com/lashhw/DLCV-Fall-2024-Final-1-uber603

- title: "Circuit Routers based on Greedy, Heuristic, and SAT Algorithms"
  image: assets/img/project_img_placeholder.jpg
  description: "Implemented channel, global, and detailed circuit routers based on foundational research papers, applying optimization techniques to NP-hard routing problems. Targeted the ISPD 2008 contest benchmarks for the global router and used MaxSAT/ILP solvers for exact detailed routing; all routers were validated against the provided specifications, achieving leading results among peers in the course."
  venue: "Course Project, The Applications of Algorithms on Routing Problems (Prof. Yih-Lang Li), NYCU"
  year: 2023
  links:
    Code: https://github.com/lashhw/routing-lab

- title: "Domain-Specific Accelerator for MLP Inference on an FPGA SoC"
  image: assets/img/project_img_placeholder.jpg
  description: "Designed a domain-specific accelerator that offloads handwritten-digit MLP inference from an FPU-less soft-core CPU on a Xilinx Artix-7 FPGA. Reordered the computation to keep the floating-point multiply-adder saturated, replicated the datapath for data parallelism, and used BRAM-backed FIFOs to overlap host transfers with computation, resulting in a 309× speedup over the software-only baseline."
  venue: "Course Project, Microprocessor Systems: Principles and Implementation (Prof. Chun-Jen Tsai), NYCU"
  year: 2023
  links:
    Report: https://github.com/lashhw/mspi-dsa/blob/main/report.pdf
    Code: https://github.com/lashhw/mspi-dsa

- title: "Linux API Sandbox and Instruction-Level Debugger"
  image: assets/img/project_img_placeholder.jpg
  description: "Built two low-level Linux tools from scratch. The first enforces an API blacklist on unmodified binaries, injecting a shared library via <code>__libc_start_main()</code> and parsing the ELF to rewrite GOT entries, so file, network, and shell calls can be interposed. The second is a ptrace-based debugger with on-the-fly disassembly, gdb-style <code>int3</code> breakpoints, and a time-travel command backed by <code>fork()</code> snapshots."
  venue: "Course Project, Advanced Programming in the UNIX Environment (Prof. Chun-Ying Huang), NYCU"
  year: 2023
  links:
    Code: https://github.com/lashhw/unixprog-hw

- title: "Parallel Ray Tracer with SIMD, OpenMP, MPI, and CUDA"
  image: assets/img/project_img_placeholder.jpg
  description: "Built a ray tracer from scratch, then parallelized it with SIMD intrinsics, OpenMP, MPI, and CUDA, guided by a loop-level analysis of where parallelism actually pays off across pixels, samples, bounces, objects, and vector components. Tuned the CUDA implementation further with coalesced memory access and a split-kernel design that lowers register pressure to improve occupancy."
  venue: "Course Team Project, Parallel Programming (Prof. Yi-Ping You), NYCU"
  year: 2023
  links:
    Slides: https://github.com/lashhw/parallel-ray-tracer/blob/main/slides.pdf
    Report: https://github.com/lashhw/parallel-ray-tracer/blob/main/report.pdf
    Code: https://github.com/lashhw/parallel-ray-tracer

- title: Memory-Efficient Attention Operator for TensorFlow Lite Micro
  image: assets/img/project_img_placeholder.jpg
  description: "Investigated the challenges of deploying Transformer models on microcontrollers (TinyML) through TensorFlow Lite for Microcontrollers (TFLM), and identified the Multi-Head Attention layer as the critical SRAM bottleneck during on-device inference. Developed and implemented a custom TFLM operator that reduces peak SRAM requirement by over 90% (from 17MB to ~1MB) for the MobileViT-XXS model."
  venue: Summer Internship, Embedded and Mobile Computing Lab (Prof. Pi-Cheng Hsiu), Academia Sinica
  year: 2023
  links:
    Code: https://github.com/lashhw/tflm-transformer

- title: Mixed-Precision Ray Tracing for Mobile Platforms
  image: assets/img/project_img_placeholder.jpg
  description: "Collaboration with MediaTek on reducing the memory bandwidth demand of ray tracing (RT) accelerators on mobile platforms. Built a ray tracer supporting physically-based rendering and parallel BVH traversal, then designed a novel mixed-precision traversal algorithm validated via SystemC TLM simulation, achieving 20% memory savings for key RT data structures."
  venue: Research Project, NYCU and MediaTek Advanced Research Center (MARC)
  year: 2023
  note: "Source code is not publicly available due to NDA restrictions."

- title: "Mini-Pascal Compiler: From Source Code to JVM Bytecode"
  image: assets/img/project_img_placeholder.jpg
  description: "Independently designed a compiler for Mini-Pascal, a Pascal subset, covering a flex-based scanner, a bison LALR parser that builds the AST, semantic analysis over a scoped symbol table with static type checking, and a code generator emitting Jasmin assembly that is further assembled into JVM bytecode. The resulting compiler correctly compiles and runs non-trivial programs like quicksort and recursive Fibonacci."
  venue: Course Project, Introduction to Compiler Design (Prof. Wuu Yang), NYCU
  year: 2022
  links:
    Code: https://github.com/lashhw/mini-pascal-compiler

- title: "Real-time Parking Vacancy Forecasting System"
  image: assets/img/project_img_placeholder.jpg
  description: "Led the team to Best Project (out of 249 students) with a system that forecasts vacancy at New Taipei City's public parking lots in real time. Designed the full architecture covering automated data collection, time-series model training, and a Vue frontend with interactive forecast charts. The LSTM model achieved low prediction error, with serverless inference on Azure Functions fast enough for live requests."
  venue: "Course Team Project, Introduction to Artificial Intelligence (Prof. Wen-Chih Peng), NYCU"
  year: 2022
  links:
    Slides: https://github.com/lashhw/AI-Final-Project/blob/main/Presentation_Team07.pdf
    Video: https://www.youtube.com/watch?v=wCParWOSb5I
    Code: https://github.com/lashhw/AI-Final-Project

- title: "Object Detection of Water-Holding Containers for Dengue Mosquito Control"
  image: assets/img/project_img_placeholder.jpg
  description: "Ranked 1st (out of 27 teams) on an AIdea object detection challenge for locating water-holding containers, the breeding sites of dengue-carrying mosquitoes. Fine-tuned COCO-pretrained YOLOv5 detectors and synthesized extra training images by pasting cut-out objects onto backgrounds, countering the severe class imbalance in the provided data."
  venue: "Course Project, Introduction to Deep Learning and Applications (Prof. Hung-Hsun Chen), NYCU"
  year: 2021
  links:
    Report: https://github.com/lashhw/Intro-to-DL-Final-Project/blob/main/report.pdf
    Code: https://github.com/lashhw/Intro-to-DL-Final-Project

- title: "Web-Based Search Tool for College Admission Requirements"
  image: assets/img/project_img_placeholder.jpg
  description: "Built a web tool that lets Taiwanese high school students look up which entrance-exam subjects and score thresholds each university department counts toward admission, consolidating information that is otherwise scattered across hundreds of pages on the official admission committees' sites. Since 2019, it has served 64,000 page views from 24,000 unique visitors."
  venue: "Side Project"
  year: 2019
  links:
    Website: https://applytool.netlify.app/
    Code: https://github.com/lashhw/applytool
